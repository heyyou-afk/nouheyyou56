<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOU! Ultimate - 繁體中文版</title>
    <!-- 使用穩定 CDN 連結 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #020617; 
            color: white; 
            margin: 0; 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: screen;
        }
        .glass { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .nou-title {
            background: linear-gradient(to bottom right, #ef4444, #f59e0b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [playerName, setPlayerName] = useState('玩家' + Math.floor(Math.random() * 1000));
            const [roomCode, setRoomCode] = useState('');
            const [difficulty, setDifficulty] = useState('普通');

            return (
                <div className="w-full max-w-6xl p-4 md:p-8">
                    {/* 頂部標題 */}
                    <div className="text-center mb-16 animate-float">
                        <h1 className="text-8xl md:text-9xl font-black italic nou-title tracking-tighter">NOU!</h1>
                        <p className="text-slate-500 font-bold tracking-[0.4em] text-xs mt-4 uppercase">終極繁體中文版</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* 聯機對戰 */}
                        <div className="glass p-10 rounded-[3rem] shadow-2xl relative group">
                            <div className="absolute -top-6 -right-6 w-24 h-24 bg-blue-600/20 rounded-full blur-3xl group-hover:bg-blue-500/40 transition-all"></div>
                            <h2 className="text-3xl font-black mb-8 flex items-center gap-4">
                                <i className="fa-solid fa-tower-broadcast text-blue-500"></i>
                                聯機對戰
                            </h2>
                            <div className="space-y-6">
                                <div>
                                    <label className="text-[10px] font-black text-slate-500 uppercase ml-2 mb-2 block">玩家暱稱</label>
                                    <input 
                                        className="w-full bg-slate-900/80 border border-slate-700 p-5 rounded-2xl text-lg font-bold outline-none focus:ring-2 ring-blue-500 transition-all"
                                        value={playerName}
                                        onChange={(e) => setPlayerName(e.target.value)}
                                    />
                                </div>
                                <div className="flex gap-3">
                                    <input 
                                        placeholder="輸入房號" 
                                        className="flex-1 bg-slate-900/80 border border-slate-700 p-5 rounded-2xl font-bold outline-none focus:ring-2 ring-blue-500" 
                                        value={roomCode}
                                        onChange={(e) => setRoomCode(e.target.value.toUpperCase())}
                                    />
                                    <button className="bg-blue-600 hover:bg-blue-500 px-8 rounded-2xl font-black transition-all">
                                        加入
                                    </button>
                                </div>
                                <div className="text-center py-4 border-t border-slate-800">
                                    <p className="text-slate-500 text-sm italic">大廳目前無公開房間</p>
                                </div>
                            </div>
                        </div>

                        {/* 電腦練習 */}
                        <div className="glass p-10 rounded-[3rem] shadow-2xl relative group">
                            <div className="absolute -top-6 -right-6 w-24 h-24 bg-purple-600/20 rounded-full blur-3xl group-hover:bg-purple-500/40 transition-all"></div>
                            <h2 className="text-3xl font-black mb-8 flex items-center gap-4">
                                <i className="fa-solid fa-microchip text-purple-500"></i>
                                電腦練習
                            </h2>
                            <div className="flex bg-slate-900/80 p-1.5 rounded-2xl mb-8">
                                {['簡單', '普通', '困難'].map(d => (
                                    <button 
                                        key={d}
                                        onClick={() => setDifficulty(d)}
                                        className={`flex-1 py-3 rounded-xl text-sm font-black transition-all ${difficulty === d ? 'bg-purple-600 text-white shadow-xl' : 'text-slate-500 hover:text-slate-300'}`}
                                    >
                                        {d}
                                    </button>
                                ))}
                            </div>
                            <div className="space-y-4">
                                <button className="w-full bg-slate-800 hover:bg-slate-700 py-6 rounded-3xl font-black text-2xl border border-white/5 transition-all flex items-center justify-center gap-4 group">
                                    <span>1 VS 1 練習</span>
                                    <i className="fa-solid fa-arrow-right text-sm group-hover:translate-x-2 transition-transform"></i>
                                </button>
                                <button className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 py-6 rounded-3xl font-black text-2xl shadow-xl transition-all flex items-center justify-center gap-4">
                                    <span>1 VS 3 亂鬥</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="mt-16 text-center">
                        <p className="text-slate-700 text-[10px] font-bold uppercase tracking-[0.5em]">
                            Vercel 部署專用修正版本
                        </p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
